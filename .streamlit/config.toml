# Knowvia arayüz teması: docs/index.html tanıtım sayfasıyla aynı koyu palet (lacivert zemin, yeşil onay, sarı vurgu) ve yazı tipi.
# `uv run streamlit run frontend/streamlit_app.py` repo kökünden çalıştırıldığında okunur.

[browser]
gatherUsageStats = false

[server]
# API'nin MAX_UPLOAD_MB sınırıyla aynı; yükleme kutusu kullanıcıya gerçek sınırı gösterir.
maxUploadSize = 10

[client]
# Geliştirici araçlarını (Deploy düğmesi vb.) gizler; uygulama menüsü kalır.
toolbarMode = "minimal"

[theme]
base = "dark"
# Birincil düğmelerde beyaz yazı okunsun diye sayfadaki yeşilin bir ton koyusu.
primaryColor = "#059669"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#162033"
codeBackgroundColor = "#0F172A"
textColor = "#E2E8F0"
linkColor = "#34D399"
borderColor = "#2A3650"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "10px"
font = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
headingFontWeights = [800, 700, 700, 600, 600, 600]
grayColor = "#94A3B8"
blueColor = "#60A5FA"
greenColor = "#10B981"
redColor = "#F87171"
orangeColor = "#FB923C"
yellowColor = "#FACC15"
violetColor = "#A78BFA"
dataframeBorderColor = "#2A3650"
dataframeHeaderBackgroundColor = "#162033"

[theme.sidebar]
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#162033"
borderColor = "#2A3650"
