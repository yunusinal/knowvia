[project]
name = "knowvia"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "httpx2>=2.13.1",
    "openai>=3.24.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.1.3",
    "tokenizers>=0.23.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
bench = [
    "psutil>=7.2.2",
]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
# Bu tarihten sonra yayımlanan paket sürümleri kullanılmaz (kararlar.md).
exclude-newer = "2026-10-05T00:00:00Z"
# Ölçüm betikleri (scripts/embedding_bench) de pyright ve testlerle denetlendiği için bench grubu da kurulur.
default-groups = ["dev", "bench"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "model: gerçek embedding modelini yükler; model önbellekte yoksa atlanır",
]
